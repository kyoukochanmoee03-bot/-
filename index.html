<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff"><title>献立メーカー</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #ddd;padding:12px}
h1{font-size:20px;margin:0 0 10px}button,select,input{font:inherit}button{border:1px solid #ccc;background:#fff;border-radius:10px;padding:9px 12px}
.nav{display:flex;gap:8px;align-items:center}#title{flex:1;text-align:center;font-weight:700}
main{max-width:1100px;margin:auto;padding:12px}.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.meal{background:#fff;border-radius:15px;margin:12px 0;padding:14px;box-shadow:0 1px 4px #0001}
.meal h2{margin:0 0 10px;font-size:18px}.item{border-top:1px solid #eee;padding:10px 0}
.item:first-of-type{border-top:0}.grid{display:grid;grid-template-columns:1.2fr 1fr 110px;gap:8px;align-items:start}
input{width:100%;border:1px solid #ddd;border-radius:8px;padding:7px}.small{font-size:12px;color:#777;margin-bottom:4px}
.actions{display:flex;gap:6px;margin-top:8px}.danger{color:#a00}.primary{background:#222;color:#fff;border-color:#222}
@media(max-width:700px){.grid{grid-template-columns:1fr}.quantity{max-width:180px}}
</style></head>
<body>

function validDays(x){
  return Array.isArray(x) && x.length===10 &&
    x.every(d=>d && d.meals && ['朝','昼','夕'].every(k=>Array.isArray(d.meals[k])));
}
let saved=null;
try{ saved=JSON.parse(localStorage.getItem('menuDays')||'null'); }catch(e){ saved=null; }
let days=validDays(saved) ? saved : JSON.parse(JSON.stringify(original));
let idx=0;
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){
 const d=days[idx];
 document.getElementById('title').textContent=d.date+'（'+d.weekday+'）';
 document.getElementById('status').textContent='10日分の献立を表示中';
 const app=document.getElementById('app');app.innerHTML='';
 ['朝','昼','夕'].forEach(k=>{
  const sec=document.createElement('section');sec.className='meal';
  sec.innerHTML='<h2>'+k+'食</h2>';
  d.meals[k].forEach((x,i)=>{
   const div=document.createElement('div');div.className='item';
   div.innerHTML='<div class="grid"><div><div class="small">メニュー</div><input value="'+esc(x.menu)+'" data-k="'+k+'" data-i="'+i+'" data-f="menu"></div>'+
   '<div><div class="small">材料</div><input value="'+esc(x.ingredients)+'" data-k="'+k+'" data-i="'+i+'" data-f="ingredients"></div>'+
   '<div><div class="small">数量</div><input class="quantity" value="'+esc(x.quantity)+'" data-k="'+k+'" data-i="'+i+'" data-f="quantity"></div></div>'+
   '<div class="actions"><button class="danger" onclick="delItem(\''+k+'\','+i+')">この品を削除</button></div>';
   sec.appendChild(div);
  });
  const add=document.createElement('button');add.textContent='＋ 品目を追加';add.onclick=()=>addItem(k);sec.appendChild(add);
  app.appendChild(sec);
 });
 document.querySelectorAll('input[data-f]').forEach(el=>el.onchange=()=>{
  days[idx].meals[el.dataset.k][+el.dataset.i][el.dataset.f]=el.value;save();
 });
}
function move(n){idx=(idx+n+days.length)%days.length;render();}
function addItem(k){days[idx].meals[k].push({menu:'新しいメニュー',ingredients:'材料',quantity:'数量'});save();render();}
function delItem(k,i){days[idx].meals[k].splice(i,1);save();render();}
function save(){localStorage.setItem('menuDays',JSON.stringify(days));}
function resetData(){if(confirm('編集内容を元に戻しますか？')){days=JSON.parse(JSON.stringify(original));save();render();}}
function random10(){
  const keys=['朝','昼','夕'];
  const pools={朝:[],昼:[],夕:[]};
  original.forEach(d=>keys.forEach(k=>pools[k].push(d.meals[k])));
  const result=[];
  for(let i=0;i<10;i++){
    const d={date:original[i].date,weekday:original[i].weekday,meals:{}};
    keys.forEach(k=>{
      let candidates=pools[k].filter((_,j)=>i===0 || JSON.stringify(pools[k][j])!==JSON.stringify(result[i-1].meals[k]));
      if(!candidates.length) candidates=pools[k];
      d.meals[k]=JSON.parse(JSON.stringify(candidates[Math.floor(Math.random()*candidates.length)]));
    });
    result.push(d);
  }
  days=result; save(); idx=0; render();
}
render();
